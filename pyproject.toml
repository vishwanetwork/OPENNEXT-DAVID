[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-order-bot"
version = "0.1.0"
description = "GPU price history and durable multi-provider capacity orders"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
mysql = ["SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2"]
dynamodb = ["boto3>=1.35,<2"]
aws = ["boto3>=1.35,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "moto[dynamodb]>=5,<6", "SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2"]

[project.scripts]
spotbot = "spotbot.cli:main"

[tool.setuptools.packages.find]
include = ["spotbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
