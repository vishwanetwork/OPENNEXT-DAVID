name: Build and Deploy

on:
  # Runs when a PR targeting main is closed; the job below only continues if it was merged
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Input image tag'
        required: false
        default: 'latest'

# Cancel in-progress runs on consecutive pushes so an older, slower build
# can't finish last and overwrite a newer deployment
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: opennext-homepage # one image: Next.js front-end + interim legacy API (see Dockerfile)
  CONTAINER_NAME: opennext-homepage

jobs:
  build:
    # Skip PRs that were closed without being merged
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # PR merge: the merge commit on main; manual run: the selected branch
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref_name }}

      # GHCR requires a lowercase image name; also pass the full image name to the deploy job
      - name: Compute image name
        id: meta
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${{ github.event.inputs.image_tag || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Upgrade container on 1Panel
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CONTAINER: ${{ env.CONTAINER_NAME }}
          API_KEY: ${{ secrets.ONEPANEL_API_KEY }}
          HOST: ${{ vars.ONEPANEL_HOST }}
        run: |
          TIMESTAMP=$(date +%s)
          TOKEN=$(echo -n "1panel${API_KEY}${TIMESTAMP}" | md5sum | awk '{print $1}')
          # Fresh random task ID for every run
          TASK_ID=$(openssl rand -hex 32)

          # -f makes the step fail on HTTP 4xx/5xx instead of silently succeeding
          curl -fsS -X POST "${HOST%/}/api/v2/containers/upgrade" \
            -H "Content-Type: application/json" \
            -H "1Panel-Token: $TOKEN" \
            -H "1Panel-Timestamp: $TIMESTAMP" \
            -d '{
              "forcePull": true,
              "image": "'"${IMAGE}"'",
              "names": ["'"${CONTAINER}"'"],
              "taskID": "'"${TASK_ID}"'"
            }'
