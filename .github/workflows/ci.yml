name: CI

on:
  pull_request:
  push:
    branches: [main, 'refactor/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: npx prettier --check "apps/**/*.{ts,tsx,css,md}" "packages/**/*.{ts,tsx,md}" "docs/**/*.md"
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (web, with coverage thresholds)
        run: pnpm --filter @opennext/web exec vitest run --coverage
      - name: Test (contracts)
        run: pnpm --filter @opennext/contracts test
      - name: Legacy API tests
        run: pnpm test:legacy
      - name: Adapter image pin tests
        run: node --test scripts/resolve-spotbot-image.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Production deployment contract tests
        run: |
          python -m unittest discover -s depoly/tests -v
          bash -n depoly/build-image.sh depoly/metadata-isolation.sh depoly/rental-check.sh depoly/aws/prepare-recovery.sh
          sh -n depoly/mysql-init.sh
      - name: Kubernetes manifests and migration scripts
        run: |
          python -m unittest discover -s depoly/k8s/tests -v
          bash -n depoly/k8s/scripts/*.sh
          for overlay in depoly/k8s/overlays/*/; do kubectl kustomize "$overlay" > /dev/null; done
      - name: Bot host compose files and scripts
        run: |
          python -m unittest discover -s depoly/bot-host/tests -v
          bash -n depoly/bot-host/*.sh
      - name: Build
        run: pnpm --filter @opennext/web build
        env:
          SITE_HOST: opennextlab.ai
          TERMINAL_HOST: terminal.opennextlab.ai
          ADMIN_HOST: admin.opennextlab.ai

  # SpotOrderBot (services/spotbot): the core Bot, the gateway and the adapter the web image bundles.
  spotbot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: services/spotbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,mysql,dynamodb]'
      - run: ruff check spotbot tests examples
      - run: pytest -q

  spotbot-databases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-test-only
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 18000:8000
    env:
      SPOTBOT_TEST_MYSQL_URL: mysql+pymysql://root:local-test-only@127.0.0.1:13306
      SPOTBOT_TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:18000
    defaults:
      run:
        working-directory: services/spotbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,mysql,dynamodb]'
      - run: pytest -q
      # The production web runs the bundled adapter on MySQL: run its suites there too.
      - name: Adapter suites on MySQL
        run: python -m pytest -q -p tests.mysql_backend tests/test_opennext*.py tests/test_funding*.py tests/test_workflows.py tests/test_rental_funding.py tests/test_local_opennext.py
      # The legacy API keeps its state documents in the same MySQL database.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy state documents on MySQL
        working-directory: legacy
        env:
          OPENNEXT_TEST_MYSQL_URL: mysql://root:local-test-only@127.0.0.1:13306
        run: |
          npm ci --no-audit --no-fund
          node --test tests/document-store.test.cjs
