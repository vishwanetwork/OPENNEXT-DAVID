services:
  web:
    build: .
    platform: linux/amd64
    image: vishwanetwork/opennext-homepage:latest
    container_name: opennext-homepage
    restart: unless-stopped
    environment:
      SITE_HOST: opennextlab.ai
      TERMINAL_HOST: terminal.opennextlab.ai
      ADMIN_HOST: admin.opennextlab.ai
      OPENNEXT_PRICING_DATA_DIR: /app/.opennext-data
      OPENNEXT_ADMIN_TOKEN: ${OPENNEXT_ADMIN_TOKEN:-}
      OPENNEXT_TRUST_PROXY: ${OPENNEXT_TRUST_PROXY:-0}
      OPENNEXT_AWS_SPOT_ENABLED: ${OPENNEXT_AWS_SPOT_ENABLED:-0}
      OPENNEXT_AWS_REGIONS: ${OPENNEXT_AWS_REGIONS:-us-east-1,us-east-2,us-west-2,eu-west-1,eu-central-1,ap-northeast-1,ap-southeast-1,ap-south-1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      LAMBDA_API_KEY: ${LAMBDA_API_KEY:-}
      SHADEFORM_API_KEY: ${SHADEFORM_API_KEY:-}
      OPENNEXT_SPOTBOT_URL: ${OPENNEXT_SPOTBOT_URL:-}
      OPENNEXT_SPOTBOT_API_KEY: ${OPENNEXT_SPOTBOT_API_KEY:-}
      OPENNEXT_CAPACITY_REGIONS: ${OPENNEXT_CAPACITY_REGIONS:-us-west-2,us-east-1}
      OPENNEXT_AZURE_REGIONS: ${OPENNEXT_AZURE_REGIONS:-eastus,westus2}
      OPENNEXT_DATA_DIR: /app/.opennext-data
      OPENNEXT_AUTH_SESSION_SECRET: ${OPENNEXT_AUTH_SESSION_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OPENNEXT_RFQ_NOTIFY_TO: ${OPENNEXT_RFQ_NOTIFY_TO:-}
      OPENNEXT_ADMIN_URL: ${OPENNEXT_ADMIN_URL:-https://admin.opennextlab.ai/}
    volumes:
      - pricing-data:/app/.opennext-data
    ports:
      # Only reachable from the server itself; the 1Panel reverse proxy forwards to it.
      - "127.0.0.1:4188:4188"
volumes:
  pricing-data:
