name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,mysql,dynamodb]'
      - run: ruff check spotbot tests examples
      - run: pytest -q
  databases:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-test-only
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 18000:8000
    env:
      SPOTBOT_TEST_MYSQL_URL: mysql+pymysql://root:local-test-only@127.0.0.1:13306
      SPOTBOT_TEST_DYNAMODB_ENDPOINT: http://127.0.0.1:18000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,mysql,dynamodb]'
      - run: pytest -q
