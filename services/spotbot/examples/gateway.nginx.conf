# Merge into the existing TLS proxy. Replace domains and certificate paths.
# The certificate must cover gateway.example.com and *.gpu.example.com.
server {
    listen 443 ssl;
    server_name gateway.example.com *.gpu.example.com;
    ssl_certificate /etc/ssl/gateway/fullchain.pem;
    ssl_certificate_key /etc/ssl/gateway/privkey.pem;

    # Do not log query strings or request headers; never put access tokens in URLs.
    access_log off;
    client_max_body_size 1g;
    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
