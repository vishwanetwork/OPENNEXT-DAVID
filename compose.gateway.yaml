services:
  gateway:
    build: .
    image: spot-order-bot:${SPOTBOT_RELEASE:-local}
    container_name: spot-order-gateway
    restart: unless-stopped
    network_mode: host
    user: "10002:10002"
    env_file: .env.gateway
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /nonexistent
      AWS_CONFIG_FILE: /nonexistent
    command: ["spotbot", "gateway", "--host", "127.0.0.1", "--port", "18084"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - gateway-data:/app/gateway-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18084/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  gateway-data:
