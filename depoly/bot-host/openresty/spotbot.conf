# Core Bot API: the OpenNEXT adapter, the legacy API and every running GPU server call it.
# Copy of the live 1Panel site /opt/1panel/www/conf.d/spotbot.test.vishwalab.com.conf;
# the certificate is the *.test.vishwalab.com wildcard 1Panel keeps under agent-cp.test.vishwalab.com.
server {
    listen 80;
    listen 443 ssl;
    server_name spotbot.test.vishwalab.com;

    access_log /www/sites/spotbot.test.vishwalab.com/log/access.log main;
    error_log /www/sites/spotbot.test.vishwalab.com/log/error.log;

    if ($scheme = http) { return 301 https://$host$request_uri; }

    ssl_certificate /www/sites/agent-cp.test.vishwalab.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/agent-cp.test.vishwalab.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
}
