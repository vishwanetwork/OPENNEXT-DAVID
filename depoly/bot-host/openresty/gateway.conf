# Rental gateway: its API (gpu-gateway.*) and every rental's model endpoint (r-<rental>.*).
# Copy of the live 1Panel site /opt/1panel/www/conf.d/gpu-gateway.test.vishwalab.com.conf.
# The certificate is the *.test.vishwalab.com wildcard 1Panel keeps under agent-cp.test.vishwalab.com.
# Customer SSH does not pass through here: the gateway listens on its SSH ports directly,
# and gpu-ssh.test.vishwalab.com points at this host.
server {
    listen 80;
    listen 443 ssl;
    server_name gpu-gateway.test.vishwalab.com ~^r-[a-f0-9-]+\.test\.vishwalab\.com$;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    ssl_certificate /www/sites/agent-cp.test.vishwalab.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/agent-cp.test.vishwalab.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    access_log off;
    client_max_body_size 1g;
    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 650s;
    }
}
