apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# In-cluster URLs in the Deployments name this namespace (spotbot.opennext.svc); keep it.
namespace: opennext
labels:
  - pairs:
      app.kubernetes.io/part-of: opennext
    includeSelectors: false
resources:
  - namespace.yaml
  - spotbot.yaml
  - gateway.yaml
  - web.yaml
