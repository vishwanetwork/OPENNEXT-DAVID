# Core Bot: price collection, rentals, funding and the API the adapter and gateway call.
# Exactly one replica: its rental, price and funding workers must never run twice.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spotbot
  # The overlay binds this account to an AWS role (EKS Pod Identity or IRSA); see README.
---
apiVersion: v1
kind: Service
metadata:
  name: spotbot
spec:
  selector:
    app.kubernetes.io/name: spotbot
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotbot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spotbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spotbot
    spec:
      serviceAccountName: spotbot
      # Same node as the gateway: the Bot also connects to GPU servers (HTTP health checks),
      # so both leave through that node's one Elastic IP, the address their security groups allow.
      nodeSelector:
        opennext.io/gateway: 'true'
      tolerations:
        - key: opennext.io/gateway
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spotbot
          image: opennext-spotbot
          command: [spotbot, serve, --host, 0.0.0.0, --port, '8000']
          ports:
            - name: http
              containerPort: 8000
          # Everything else, including secrets and the MySQL URL, comes from the migrated Secret.
          envFrom:
            - secretRef:
                name: spotbot-env
          env:
            # In-cluster calls; these win over the same names in the Secret.
            - name: SPOTBOT_GATEWAY_WEBHOOK_URL
              value: http://spotbot-gateway.opennext.svc:18084/v1/gateway/events
            - name: AWS_CONFIG_FILE
              value: /app/aws/config
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: aws-config
              mountPath: /app/aws
              readOnly: true
      volumes:
        # With MySQL storage the Bot keeps nothing on disk; the live volume is empty.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: aws-config
          configMap:
            name: spotbot-aws-config
