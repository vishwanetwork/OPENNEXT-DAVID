# OpenNEXT test site on the bot test host: one OpenNEXT container built with the bundled
# SpotOrderBot adapter and ClamAV (OPENNEXT_ADAPTER=1), as production would run it, plus Mailpit,
# which receives every email (sign-in codes and notices) in a protected inbox. Mailpit shares
# the web container's network namespace so SMTP stays on 127.0.0.1.
name: opennext-test
services:
  web:
    image: opennext-test-web:${WEB_RELEASE:?set WEB_RELEASE}
    restart: unless-stopped
    command: ["node", "/opt/test/start-test.cjs"]
    env_file: [web.env, adapter.env]
    environment:
      SITE_HOST: opennext.test.vishwalab.com
      TERMINAL_HOST: opennext-terminal.test.vishwalab.com
      ADMIN_HOST: opennext-admin.test.vishwalab.com
      OPENNEXT_ADMIN_URL: https://opennext-admin.test.vishwalab.com/
      OPENNEXT_TRUST_PROXY: "1"
      OPENNEXT_DATA_DIR: /app/.opennext-data
      OPENNEXT_PRICING_DATA_DIR: /app/.opennext-data
      OPENNEXT_SPOTBOT_URL: https://spotbot.test.vishwalab.com
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_FROM: OpenNEXT Test <no-reply@opennext.test.vishwalab.com>
      OPENNEXT_ADAPTER: "1"
      SPOTBOT_OPENNEXT_BOT_URL: https://spotbot.test.vishwalab.com
      SPOTBOT_OPENNEXT_GATEWAY_URL: https://gpu-gateway.test.vishwalab.com
      SPOTBOT_OPENNEXT_SMTP_HOST: 127.0.0.1
      SPOTBOT_OPENNEXT_SMTP_PORT: "1025"
      SPOTBOT_OPENNEXT_SMTP_FROM: OpenNEXT Test <no-reply@opennext.test.vishwalab.com>
      SPOTBOT_OPENNEXT_PUBLIC_URL: https://opennext-terminal.test.vishwalab.com
      SPOTBOT_AWS_REGIONS: us-west-2,us-east-1,us-east-2
      SPOTBOT_RENTAL_REGIONS: us-west-2,us-east-1,us-east-2
    volumes:
      - web-data:/app/.opennext-data
      - ./start-test.cjs:/opt/test/start-test.cjs:ro
    ports:
      - "127.0.0.1:18188:4188" # OpenNEXT, behind OpenResty
      - "127.0.0.1:18025:8025" # Mailpit inbox, behind OpenResty
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    network_mode: service:web
    depends_on: [web]
    env_file: [mailpit.env]
    environment:
      MP_SMTP_BIND_ADDR: 127.0.0.1:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_MAX_MESSAGES: "2000"
volumes:
  web-data:
