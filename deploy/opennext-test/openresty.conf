# OpenResty (1Panel) sites for the OpenNEXT test stack; copy to /opt/1panel/www/conf.d/.
# The wildcard certificate covers *.test.vishwalab.com.
server {
    listen 80;
    listen 443 ssl;
    server_name opennext.test.vishwalab.com opennext-terminal.test.vishwalab.com opennext-admin.test.vishwalab.com;

    access_log /www/sites/opennext.test.vishwalab.com/log/access.log main;
    error_log /www/sites/opennext.test.vishwalab.com/log/error.log;

    if ($scheme = http) { return 301 https://$host$request_uri; }

    ssl_certificate /www/sites/agent-cp.test.vishwalab.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/agent-cp.test.vishwalab.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Buyer KYB documents upload as base64 JSON, up to 10 MB per file.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:18188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name opennext-mail.test.vishwalab.com;

    access_log /www/sites/opennext.test.vishwalab.com/log/mail-access.log main;
    error_log /www/sites/opennext.test.vishwalab.com/log/mail-error.log;

    if ($scheme = http) { return 301 https://$host$request_uri; }

    ssl_certificate /www/sites/agent-cp.test.vishwalab.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/agent-cp.test.vishwalab.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
